# Continuous integration — implements the lint, test, wasm and web jobs of
# docs/12-testing-and-quality.md §4. The render, fuzz, bench and release jobs
# are added with the milestones that need them (docs/13-roadmap.md). The
# commands live in tools/ci-steps.sh, which tools/ci-local.sh also runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: lint (fmt, clippy, deny, docs, boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: tools/ci-steps.sh fmt
      - name: cargo clippy
        run: tools/ci-steps.sh clippy
      - name: cargo doc
        run: tools/ci-steps.sh doc
      - name: architecture boundaries (docs/01 §1.1)
        run: tools/ci-steps.sh boundaries
      - name: cargo deny (licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Headless rendering needs an adapter (docs/06 §11): lavapipe on Linux;
      # Windows has WARP and macOS Metal.
      - name: software Vulkan (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: build optional SKP converter
        shell: bash
        run: tools/ci-steps.sh converter
      - name: cargo test with optional SKP converter
        shell: bash
        run: tools/ci-steps.sh test
      - name: snapshot images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}
          path: target/tmp/*.actual.png
          if-no-files-found: ignore

  wasm:
    name: wasm (planyrith-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (wasm32-unknown-unknown)
        run: tools/ci-steps.sh wasm

  web:
    name: web (GUI build, size budget, headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The CLI must match the `wasm-bindgen` crate in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: cargo clippy (wasm32-unknown-unknown)
        run: tools/ci-steps.sh web-clippy
      - name: build the web application and check its size budget (docs/11 §4)
        run: tools/ci-steps.sh web-build
      - name: storage conformance and classroom scenario in headless Chrome (docs/11 §7, docs/13 0.7)
        run: tools/ci-steps.sh web-test
      - uses: actions/upload-artifact@v4
        with:
          name: planyrith-web
          path: dist/web
