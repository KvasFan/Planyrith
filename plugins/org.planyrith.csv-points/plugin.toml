[plugin]
id = "org.planyrith.csv-points"
name = "CSV Point Importer"
version = "0.1.0"
authors = ["Planyrith contributors"]
license = "MIT OR Apache-2.0"
min_planyrith = "0.8.0"
description = "Read x,y,z rows into a group of guide points."

[entry]
script = "main.rhai"

[capabilities]
ui_forms = true

[[tools]]
name = "points"
label = "Import CSV points"
category = "draw"
params_schema = "params.json"
form = "form.json"
on_execute = "build"

[[menus]]
path = "Extensions/CSV Point Importer"
on_click = "build"

[[toolbars]]
name = "CSV Point Importer"
items = ["tools:points"]

[[panels]]
name = "CSV Point Importer options"
form = "form.json"
on_change = "build"
