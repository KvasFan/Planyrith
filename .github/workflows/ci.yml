# Continuous integration — implements the lint, test, wasm and web jobs of
# docs/12-testing-and-quality.md §4. The render, fuzz, bench and release jobs
# are added with the milestones that need them (docs/13-roadmap.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: lint (fmt, clippy, deny, docs, boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D clippy::all
      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: architecture boundaries (docs/01 §1.1)
        run: |
          set -eu
          fail=0
          for forbidden in egui eframe egui-wgpu egui_tiles winit wgpu web-sys; do
            if grep -Eq "^${forbidden}\s*=" crates/planyrith-core/Cargo.toml; then
              echo "planyrith-core must not depend on ${forbidden}"; fail=1
            fi
          done
          for forbidden in egui eframe egui-wgpu egui_tiles winit; do
            if grep -Eq "^${forbidden}\s*=" crates/planyrith-render/Cargo.toml; then
              echo "planyrith-render must not depend on ${forbidden}"; fail=1
            fi
          done
          for forbidden in egui eframe egui-wgpu egui_tiles wgpu; do
            if grep -Eq "^${forbidden}\s*=" crates/planyrith-cli/Cargo.toml; then
              echo "planyrith-cli must not depend on ${forbidden}"; fail=1
            fi
          done
          cargo tree -p planyrith-core -p planyrith-cli -p planyrith-render -p planyrith-gui --edges normal --prefix none --format '{p}' > /tmp/application-dependencies.txt
          if grep -Eq '^(openskp|planyrith-skp) v' /tmp/application-dependencies.txt; then
            echo "optional GPL converters must never be linked into the applications"; fail=1
          fi
          exit "$fail"
      - name: cargo deny (licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Headless rendering needs an adapter (docs/06 §11): lavapipe on Linux;
      # Windows has WARP and macOS Metal.
      - name: software Vulkan (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: build optional SKP converter
        # Optional GPL converter stays a separate process; test it on each OS.
        run: cargo build -p planyrith-skp
      - name: cargo test with optional SKP converter
        run: cargo test --workspace
        env:
          PLANYRITH_REQUIRE_GPU: "1"
          PLANYRITH_REQUIRE_SKP: "1"
      - name: snapshot images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}
          path: target/tmp/*.actual.png
          if-no-files-found: ignore

  wasm:
    name: wasm (planyrith-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (wasm32-unknown-unknown)
        run: cargo check -p planyrith-core --target wasm32-unknown-unknown

  web:
    name: web (GUI build, size budget, headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The CLI must match the `wasm-bindgen` crate in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: cargo clippy (wasm32-unknown-unknown)
        run: cargo clippy -p planyrith-gui -p planyrith-render --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: build the web application and check its size budget (docs/11 §4)
        run: tools/build-web.sh dist/web
      - name: storage conformance and classroom scenario in headless Chrome (docs/11 §7, docs/13 0.7)
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p planyrith-gui --target wasm32-unknown-unknown --test web
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          # Debug sections substantially increase wasm-bindgen's peak memory.
          CARGO_PROFILE_TEST_DEBUG: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: planyrith-web
          path: dist/web
