[package]
name = "planyrith-cli"
description = "Planyrith command-line frontend: every tool as a subcommand, scripting, headless export, and the JSON-RPC server the GUI can attach to"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "planyrith"
path = "src/main.rs"

# Allowed dependencies are listed in docs/01-architecture.md §1.1. This crate
# must never depend on egui, or on wgpu directly (it goes through
# planyrith-render).
[dependencies]
planyrith-core = { workspace = true }
# The headless `render` verb arrives with milestone 0.2 (docs/13); until then
# the renderer (and its GPU stack) is optional so CLI builds stay light.
planyrith-render = { workspace = true, optional = true }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[features]
default = []
render = ["dep:planyrith-render"]

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
