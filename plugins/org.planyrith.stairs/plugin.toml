[plugin]
id = "org.planyrith.stairs"
name = "Stair Builder"
version = "0.1.0"
authors = ["Planyrith contributors"]
license = "MIT OR Apache-2.0"
min_planyrith = "0.8.0"
description = "Build a grouped flight of steps from total rise and run."

[entry]
script = "main.rhai"

[capabilities]
ui_forms = true

[[tools]]
name = "stairs"
label = "Build stairs"
category = "draw"
params_schema = "params.json"
form = "form.json"
on_execute = "build"

[[menus]]
path = "Extensions/Stair Builder"
on_click = "build"

[[toolbars]]
name = "Stair Builder"
items = ["tools:stairs"]

[[panels]]
name = "Stair Builder options"
form = "form.json"
on_change = "build"
