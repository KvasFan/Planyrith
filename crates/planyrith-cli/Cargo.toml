[package]
name = "planyrith-cli"
description = "Planyrith command-line frontend: every tool as a subcommand, scripting, headless export, and the JSON-RPC server the GUI can attach to"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "planyrith"
path = "src/main.rs"

# Allowed dependencies are listed in docs/01-architecture.md §1.1. This crate
# must never depend on egui, or on wgpu directly (it goes through
# planyrith-render).
[dependencies]
planyrith-core = { workspace = true, features = ["scripting", "brep"] }
# The headless `render` verb (docs/06 §11). Default since 0.2; build with
# `--no-default-features` for a CLI without the GPU stack.
planyrith-render = { workspace = true, optional = true }
image = { workspace = true, optional = true }
clap = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[features]
default = ["render"]
render = ["dep:planyrith-render", "dep:image"]

[dev-dependencies]
zip = { workspace = true }
assert_cmd = { workspace = true }
image = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
