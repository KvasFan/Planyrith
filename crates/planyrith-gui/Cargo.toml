[package]
name = "planyrith-gui"
description = "Planyrith graphical frontend: egui/eframe shell with a wgpu 3D viewport, on desktop and WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "planyrith-gui"
path = "src/main.rs"

# Allowed dependencies are listed in docs/01-architecture.md §1.1.
# wasm-bindgen / web-sys / rexie are added with the web build (docs/11).
[dependencies]
planyrith-core = { workspace = true }
planyrith-render = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
egui-wgpu = { workspace = true }
egui_tiles = { workspace = true }
egui-file-dialog = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
pollster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Whole-window screenshots of the GUI, headless (docs/12 §7).
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }

[lints]
workspace = true
