[package]
name = "planyrith-core"
description = "Planyrith document model, geometry kernel, command system and file I/O (no GUI, no GPU)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[example]]
name = "generate-sheets"
path = "../../tools/generate-sheets.rs"

[[example]]
name = "generate-skp-fixture"
path = "../../tools/generate-skp-fixture.rs"

[[example]]
name = "generate-solids"
path = "../../tools/generate-solids.rs"
required-features = ["brep"]

# Allowed dependencies are listed in docs/01-architecture.md §1.1. This crate
# must never depend on a GUI toolkit, a GPU API or a windowing library.
[dependencies]
glam = { workspace = true }
libm = { workspace = true }
parry3d-f64 = { workspace = true }
earcutr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
slotmap = { workspace = true }
indexmap = { workspace = true }
bytemuck = { workspace = true }
blake3 = { workspace = true }
uuid = { workspace = true }
image = { workspace = true }
tracing = { workspace = true }
tobj = { workspace = true }
gltf = { workspace = true }
pdf-writer = { workspace = true }
subsetter = { workspace = true }
ttf-parser = { workspace = true }
rayon = { workspace = true, optional = true }
rhai = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
truck-modeling = { workspace = true, optional = true }
truck-stepio = { workspace = true, optional = true }
truck-topology = { workspace = true, optional = true }
truck-meshalgo = { workspace = true, optional = true }
truck-shapeops = { workspace = true, optional = true }

# Random UUIDs in the browser go through the JavaScript crypto API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
# B-rep conversion, STEP and numerical boolean fallback (docs/13 0.8).
brep = ["dep:truck-modeling", "dep:truck-stepio", "dep:truck-topology", "dep:truck-meshalgo", "dep:truck-shapeops"]
# Sandboxed Rhai scripting and declarative plugin manifests (docs/10).
scripting = ["dep:rhai", "dep:toml"]
# rayon-based data parallelism on desktop targets (docs/01 §6).
parallel = ["dep:rayon"]

[lints]
workspace = true
