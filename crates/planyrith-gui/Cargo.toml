[package]
name = "planyrith-gui"
description = "Planyrith graphical frontend: egui/eframe shell with a wgpu 3D viewport, on desktop and WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "planyrith-gui"
path = "src/main.rs"

# Allowed dependencies are listed in docs/01-architecture.md §1.1.
[dependencies]
planyrith-core = { workspace = true, features = ["scripting", "brep"] }
planyrith-render = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
egui-wgpu = { workspace = true }
egui_tiles = { workspace = true }
egui-file-dialog = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
pollster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `Instant` that also works in the browser (std's panics on wasm32).
web-time = "1"

# The web build (docs/11 §4): the browser's IndexedDB, files and events.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGPU where the browser has it, WebGL2 elsewhere (docs/11 §4.2).
wgpu = { workspace = true, features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
rexie = "0.6"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement",
    "HtmlCanvasElement", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Event",
    "Storage", "Navigator", "StorageManager", "Location", "BeforeUnloadEvent",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
# Whole-window screenshots of the GUI, headless (docs/12 §7).
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }

[lints]
workspace = true
